name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # A build is made for every possible combination of parameters
        # You can add or remove entries from the arrays of each parameter to customize which builds you want to run.
        # See https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/running-variations-of-jobs-in-a-workflow
        target:
          [
            # { platform: linux, arch: x86_64, os: ubuntu-22.04 },
            { platform: windows, arch: x86_64, os: windows-latest },
            # { platform: macos, arch: universal, os: macos-latest },
            
            # { platform: android, arch: x86_64, os: ubuntu-22.04 },
            # { platform: android, arch: x86_32, os: ubuntu-22.04 },
            # { platform: android, arch: arm64, os: ubuntu-22.04 },
            # { platform: android, arch: arm32, os: ubuntu-22.04 },
            # { platform: ios, arch: arm64, os: macos-latest },
            # { platform: web, arch: wasm32, os: ubuntu-22.04 },
          ]
        target-type: [template_debug, template_release]
        # float-precision: [single]

    runs-on: ${{ matrix.target.os }}
    steps:
      # Clone this repository
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      # # Add linux x86_32 toolchain
      # - name: Install multilib support
      #   if: ${{ matrix.target.platform == 'linux' && matrix.target.arch == 'x86_32' }}
      #   run: |
      #     sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib

      # Setup dependencies
      - name: Setup godot-cpp
        uses: ./godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.target.platform }}
          em-version: 3.1.62

      # Build GDExtension (with caches)

      # - name: Restore .scons_cache
      #   uses: ./godot-cpp/.github/actions/godot-cache-restore
      #   with:
      #     scons-cache: ${{ github.workspace }}/.scons-cache/
      #     cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.target-type }}

      - name: Build GDExtension
        shell: sh
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
        run: |
          scons target=${{ matrix.target-type }} platform=${{ matrix.target.platform }} arch=${{ matrix.target.arch }}

      # - name: Save .scons_cache
      #   uses: ./godot-cpp/.github/actions/godot-cache-save
      #   with:
      #     scons-cache: ${{ github.workspace }}/.scons-cache/
      #     cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.target-type }}

      # Clean up compilation files
      - name: Windows - Delete compilation files
        if: ${{ matrix.target.platform == 'windows' }}
        shell: pwsh
        run: |
          Remove-Item bin/* -Include *.exp,*.lib,*.pdb -Force

      # Upload the build
      # upload each built library as a single file
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: gdtoml-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.target-type }}
          path: ${{ github.workspace }}/bin/**
          archive: false # prevents zipping each upload

  # Merges all the build artifacts together into a single godot-cpp-template artifact.
  # If you comment out this step, all the builds will be uploaded individually.
  # merge:
  #   runs-on: ubuntu-22.04
  #   needs: build
  #   steps:
  #     - name: Merge Artifacts
  #       uses: actions/upload-artifact/merge@v7
  #       with:
  #         name: gdtoml
  #         pattern: gdtoml-*
  #         delete-merged: true
  
  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          path: release/gdtoml/
          skip-decompress: true # prevents zipping each download
          merge-multiple: true # prevents creating sub folder for each download

      # Step 2: Use standard bash commands to create the folder and copy
      - name: Copy addon files
        run: |
          cp godot/addons/gdtoml/*.gdextension release/gdtoml/
          cp godot/addons/gdtoml/*.gd release/gdtoml/
          cp godot/addons/gdtoml/*.cfg release/gdtoml/

      - name: Create ZIP archive
        run: |
          cd release
          zip -r ../gdtoml_${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            gdtoml_${{ github.ref_name }}.zip \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes